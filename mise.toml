# The .NET SDK version is pinned in global.json, which accepts any later 10.0.x feature band.

[env]
DOTNET_NOLOGO = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1"

[tools]
dotnet = "10"
# puppeteer in tools/oracle needs 22.12.0 or later, and "22" accepts any 22.x that is installed.
node = "22.23"

[tasks.build]
description = "Build the solution"
run = "dotnet build SplashTheMusical.slnx"

[tasks.test]
description = "Build, then run the tests"
run = "dotnet test --solution SplashTheMusical.slnx"

[tasks.format]
description = "Format the repository"
run = "dotnet format SplashTheMusical.slnx"

[tasks.check]
description = "Fail on formatting drift"
run = "dotnet format SplashTheMusical.slnx --verify-no-changes"

[tasks.oracle]
description = "Write the mermaid.js facts of every case in a folder. tools/oracle/README.md describes the outputs"
usage = '''
arg "[cases]" help="Folder of .mmd cases" default="tools/oracle/cases"
arg "[facts]" help="Folder the facts files go to" default=".artifacts/oracle/facts"
arg "[svg]" help="Folder the SVGs go to" default=".artifacts/oracle/svg"
'''
run = [
  "test -d tools/oracle/node_modules || npm ci --prefix tools/oracle --no-audit --no-fund",
  'node tools/oracle/facts.mjs "${usage_cases}" "${usage_facts}" "${usage_svg}"',
]

[tasks.corpus]
description = "Write the docs, e2e and parser cases of corpus/ from a mermaid checkout. corpus/README.md describes them"
usage = '''
arg "<checkout>" help="A checkout of mermaid-js/mermaid at the tag of the mermaid tools/oracle pins"
'''
run = 'node tools/corpus/corpus.mjs "${usage_checkout}"'

[tasks.upstream-generate]
description = "Write the MermaidConfig classes in src/SplashTheMusical/Config/Generated from a mermaid checkout's config schema"
usage = '''
arg "<checkout>" help="A checkout of mermaid-js/mermaid at the tag of the mermaid tools/oracle pins"
flag "--check" help="Write nothing, and fail when a generated file differs from the committed one"
'''
run = 'dotnet run --project tools/SplashTheMusical.Upstream -- config "${usage_checkout}" $([ "${usage_check:-false}" = "true" ] && echo --check)'

[tasks.upstream-fonts]
description = "Write the text measurer's width tables in src/SplashTheMusical/Text/Generated from the bundled font files"
usage = '''
flag "--check" help="Write nothing, and fail when the generated tables differ from the committed ones"
'''
run = 'dotnet run --project tools/SplashTheMusical.Upstream -- fonts $([ "${usage_check:-false}" = "true" ] && echo --check)'

[tasks.upstream-compatibility]
description = "Write MermaidCompatibility in src/SplashTheMusical/Generated from the mermaid version in tools/oracle/package-lock.json"
usage = '''
flag "--check" help="Write nothing, and fail when the generated file differs from the committed one"
'''
run = 'dotnet run --project tools/SplashTheMusical.Upstream -- compatibility $([ "${usage_check:-false}" = "true" ] && echo --check)'

[tasks.upstream-bump]
description = "Move the oracle to another mermaid version, regenerate what depends on it, and write .artifacts/upstream/after/upstream-delta.md"
usage = '''
arg "<version>" help="The mermaid version, such as 12.3.0"
'''
run = 'bash tools/upstream/bump.sh "${usage_version}"'

[tasks.corpus-oracle]
description = "Write the mermaid.js facts, boxes and dagre files of every case in corpus/"
run = [
  "test -d tools/oracle/node_modules || npm ci --prefix tools/oracle --no-audit --no-fund",
  "node tools/oracle/facts.mjs corpus corpus .artifacts/corpus/svg",
]

[tasks.colors]
description = "Write corpus/colors.txt, khroma's results on mermaid's theme colours"
run = [
  "test -d tools/oracle/node_modules || npm ci --prefix tools/oracle --no-audit --no-fund",
  "node tools/oracle/colors.mjs corpus/colors.txt",
]

[tasks.curves]
description = "Write corpus/curves.txt and corpus/markers.txt, d3-shape's curves and mermaid's edge paths and markers"
run = [
  "test -d tools/oracle/node_modules || npm ci --prefix tools/oracle --no-audit --no-fund",
  "node tools/oracle/curves.mjs corpus/curves.txt corpus/markers.txt",
]

[tasks.parity]
description = "Write docs/parity-report.md from the committed oracle output and the ledgers"
env = { STM_WRITE_REPORT = "1" }
run = 'dotnet run --project tests/SplashTheMusical.Conformance -- --treenode-filter "/*/*/ParityReportTests/*"'

[tasks.api]
description = "Rewrite docs/api/SplashTheMusical.txt, the core's public API, which PublicApiTests checks"
env = { STM_WRITE_API = "1" }
run = 'dotnet run --project tests/SplashTheMusical.Tests -- --treenode-filter "/*/*/PublicApiTests/*"'

[tasks.stm-svg]
description = "Write the SVG STM draws for each corpus case to .artifacts/stm/svg"
env = { STM_SVG_DIR = "{{config_root}}/.artifacts/stm/svg" }
run = 'dotnet run --project tests/SplashTheMusical.Conformance -- --treenode-filter "/*/*/StmSvgsTests/*"'

[tasks.raster]
description = "Rasterize mermaid.js's and STM's SVG of every corpus case, write corpus/l4.txt and the side-by-side images of failing cases"
depends = ["stm-svg", "corpus-oracle"]
run = "node tools/oracle/raster.mjs corpus .artifacts/corpus/svg .artifacts/stm/svg corpus/l4.txt .artifacts/raster .artifacts/corpus/raster"

[tasks.oracle-roundtrip]
description = "Write STM's text of every accepted corpus case and of random documents, run the oracle on it, and fail when mermaid.js reads a case differently or refuses one"
env = { STM_ROUNDTRIP_DIR = "{{config_root}}/.artifacts/roundtrip" }
run = [
  "test -d tools/oracle/node_modules || npm ci --prefix tools/oracle --no-audit --no-fund",
  'dotnet run --project tests/SplashTheMusical.Conformance -- --treenode-filter "/*/*/OracleRoundTripTests/WritesTheCasesWhenAsked"',
  'dotnet run --project tests/SplashTheMusical.Tests -- --treenode-filter "/*/*/OracleSampleTests/*"',
  'node tools/oracle/facts.mjs "$STM_ROUNDTRIP_DIR" "$STM_ROUNDTRIP_DIR" > "$STM_ROUNDTRIP_DIR.log"',
  'dotnet run --project tests/SplashTheMusical.Conformance -- --treenode-filter "/*/*/OracleRoundTripTests/CopiesTheDifferingOriginalsWhenAsked"',
  'node tools/oracle/facts.mjs "$STM_ROUNDTRIP_DIR/original" "$STM_ROUNDTRIP_DIR/original" >> "$STM_ROUNDTRIP_DIR.log"',
  'dotnet run --project tests/SplashTheMusical.Conformance -- --treenode-filter "/*/*/OracleRoundTripTests/ComparesTheFactsWhenAsked"',
]

[tasks.fuzz-crash]
description = "Feed mutated corpus sources to STM's parser and renderer under ResourceLimits.Default, and fail on a crash or a missed deadline"
usage = '''
arg "[sources]" help="Sources per diagram type" default="100000"
arg "[seed]" help="The seed. A find is reproducible from its type, the seed and its index" default="1"
'''
run = 'STM_FUZZ_CRASH_SOURCES="${usage_sources}" STM_FUZZ_SEED="${usage_seed}" dotnet run --project tests/SplashTheMusical.Conformance -c Release -- --treenode-filter "/*/*/FuzzRunTests/CrashFuzzesWhenAsked" --output Detailed'

[tasks.fuzz-diff]
description = "Run sources mutated from the corpus and grammar sentences through mermaid.js and STM, and write the minimized differences to .artifacts/fuzz/differential"
usage = '''
arg "[seconds]" help="Seconds per diagram type" default="60"
arg "[seed]" help="The seed" default="1"
'''
run = 'bash tools/fuzz/differential.sh "${usage_seconds}" "${usage_seed}"'

[tasks.fuzz-add]
description = "Add minimized finds of mise run fuzz-diff to the corpus with their oracle files"
usage = '''
arg "[finds]" help="A find, such as .artifacts/fuzz/differential/finds/flowchart/a1b2c3.mmd, or a folder of finds" default=".artifacts/fuzz/differential/finds"
'''
run = [
  "test -d tools/oracle/node_modules || npm ci --prefix tools/oracle --no-audit --no-fund",
  'node tools/oracle/add.mjs "${usage_finds}"',
]

[tasks.conformance-aot]
description = "Run the conformance tests under JIT and native AOT, and fail when their corpus results differ"
run = [
  "rm -rf .artifacts/results",
  "dotnet publish tests/SplashTheMusical.Conformance -o .artifacts/conformance-aot",
  'STM_RESULTS_FILE="{{config_root}}/.artifacts/results/jit.txt" dotnet run --project tests/SplashTheMusical.Conformance',
  'STM_RESULTS_FILE="{{config_root}}/.artifacts/results/aot.txt" .artifacts/conformance-aot/SplashTheMusical.Conformance',
  "git diff --no-index --exit-code --stat .artifacts/results/jit.txt .artifacts/results/aot.txt",
]

[tasks.oracle-test]
description = "Test the oracle: two identical runs, every diagram type, the boxes and the font, the dumps, the failures and the L4 raster scores"
run = [
  "test -d tools/oracle/node_modules || npm ci --prefix tools/oracle --no-audit --no-fund",
  "node --test tools/oracle/facts.test.mjs tools/oracle/raster.test.mjs tools/oracle/dumps.test.mjs",
]

[tasks.bench]
description = "Run STM's stages on the benchmark set under JIT and native AOT, and write a result file"
usage = '''
arg "[out]" help="The result file" default=".artifacts/bench/stm-results.md"
'''
run = 'dotnet run --project tests/SplashTheMusical.Benchmarks -c Release -- bench --out "${usage_out}"'

[tasks.bench-compare]
description = "Fail when a result file is more than 10% worse in time or allocation than the committed numbers"
usage = '''
arg "[run]" help="The result file of a run" default=".artifacts/bench/stm-results.md"
arg "[committed]" help="The committed numbers" default="docs/benchmarks/stm.md"
'''
run = 'dotnet run --project tests/SplashTheMusical.Benchmarks -c Release -- compare "${usage_committed}" "${usage_run}"'

[tasks.bench-budget]
description = "Fail when STM's parse time or allocation is over the Mermaider baseline on a case of a measured type"
usage = '''
arg "[run]" help="The result file of a run" default="docs/benchmarks/stm.md"
arg "[baseline]" help="The Mermaider baseline" default="docs/benchmarks/mermaider-baseline.md"
'''
run = 'dotnet run --project tests/SplashTheMusical.Benchmarks -c Release -- budget "${usage_baseline}" "${usage_run}"'

[tasks.bench-mermaider]
description = "Run the Mermaider baseline on the benchmark set and rewrite docs/benchmarks/mermaider-baseline.md"
run = "dotnet run --project tests/SplashTheMusical.Benchmarks -c Release -- mermaider"

[tasks.bench-dagre]
description = "Run the dagre port on generated graphs of 10, 100 and 1,000 nodes under JIT and native AOT, and rewrite docs/benchmarks/dagre.md"
run = "dotnet run --project tests/SplashTheMusical.Benchmarks -c Release -- dagre"

[tasks.bench-select]
description = "Pick the benchmark set from the corpus and rewrite corpus/benchmarks/cases.txt"
run = "dotnet run --project tests/SplashTheMusical.Benchmarks -c Release -- select"

[tasks.size]
description = "Fail when the core assembly or the native AOT stm is more than 5% larger than docs/benchmarks/sizes.md"
usage = '''
flag "--accept" help="Rewrite the sizes of this machine's rows instead of checking them"
'''
run = [
  "dotnet build src/SplashTheMusical -c Release",
  "dotnet publish src/SplashTheMusical.Cli",
  'dotnet run --project tests/SplashTheMusical.Benchmarks -c Release -- size $([ "${usage_accept:-false}" = "true" ] && echo --accept)',
]

[tasks.ci]
description = "What CI runs: build, test and the formatting check"
run = [
  "dotnet build SplashTheMusical.slnx",
  "dotnet test --solution SplashTheMusical.slnx --no-build",
  "dotnet format SplashTheMusical.slnx --verify-no-changes --no-restore",
]
