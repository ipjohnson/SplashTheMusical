name: Comparison difference
description: STM draws a corpus case differently from mermaid.js. The site's "Report a difference" button fills in this form.
labels: [comparison]
body:
  - type: markdown
    attributes:
      value: |
        The comparison site filled in the fields below. Describe what is wrong in the last one.
  - type: input
    id: case
    attributes:
      label: Comparison case
      description: The corpus case, such as flowchart/basic.
    validations:
      required: true
  - type: input
    id: snapshot
    attributes:
      label: Snapshot
  - type: input
    id: score
    attributes:
      label: Score
  - type: textarea
    id: images
    attributes:
      label: Images
  - type: textarea
    id: source
    attributes:
      label: Source
      render: mermaid
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: What STM draws differently, and where.
    validations:
      required: true
