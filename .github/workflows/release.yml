name: Release

# Pushing a tag v<version> publishes the packages of that commit to nuget.org. The tag must equal the Version of
# Directory.Build.props, such as v0.0.1-alpha, and its commit must be on main. nuget.org refuses a version it already has,
# so each release takes a new version.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # NuGet/login trades the run's OIDC token for a short-lived key, under nuget.org's trusted publishing policy for
      # this repository and release.yml.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Fail unless the tag is the version and its commit is on main
        shell: bash
        run: |
          version=$(dotnet msbuild src/SplashTheMusical/SplashTheMusical.csproj -getProperty:Version)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v$version, the Version of Directory.Build.props."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The commit of $GITHUB_REF_NAME is not on main."
            exit 1
          fi

      - name: Build
        run: dotnet build SplashTheMusical.slnx -c Release

      - name: Test
        run: dotnet test --solution SplashTheMusical.slnx -c Release --no-build

      - name: Pack, and run the sample built from the packages
        run: bash tools/packages/pack.sh

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: .artifacts/package

      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # dotnet nuget push sends each .snupkg with its .nupkg.
      - name: Push to nuget.org
        run: >-
          dotnet nuget push ".artifacts/package/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
