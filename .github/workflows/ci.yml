name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The l4 job of this run skips its cache. A runner image can change the fonts Chromium falls back to without changing
  # the cache key.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build SplashTheMusical.slnx

      # LedgerTests writes the corpus results of the JIT run, which the native run's must equal.
      - name: Test
        env:
          STM_RESULTS_FILE: ${{ github.workspace }}/.artifacts/results/jit.txt
        run: dotnet test --solution SplashTheMusical.slnx --no-build

      - name: Check formatting
        run: dotnet format SplashTheMusical.slnx --verify-no-changes --no-restore

      # -warnaserror fails each publish on any warning, MSBuild's included. Trim, AOT and ILC warnings are errors anyway.
      - name: Publish stm with native AOT
        run: dotnet publish src/SplashTheMusical.Cli -warnaserror

      - name: Render a diagram with the native stm
        shell: bash
        run: |
          stm=./.artifacts/publish/SplashTheMusical.Cli/release/stm
          mermaid=$(node tools/upstream/versions.mjs pinned)
          svg=$(printf 'info' | "$stm" render)
          case "$svg" in
            "<svg "*"$mermaid"*"</svg>") echo "${svg:0:120}" ;;
            *) echo "::error::stm render printed no SVG of the info diagram: ${svg:0:200}"; exit 1 ;;
          esac
          "$stm" version | tee .artifacts/stm-version.txt
          grep -qx "mermaid.js $mermaid" .artifacts/stm-version.txt

      - name: Publish the DependencyModule sample with native AOT
        run: dotnet publish samples/SplashTheMusical.Sample -warnaserror -o .artifacts/sample-aot

      # It exits with 1 unless IMermaid resolves from the container and renders a diagram.
      - name: Run the native DependencyModule sample
        shell: bash
        run: ./.artifacts/sample-aot/SplashTheMusical.Sample > /dev/null

      - name: Publish the conformance runner with native AOT
        run: dotnet publish tests/SplashTheMusical.Conformance -warnaserror -o .artifacts/conformance-aot

      - name: Run the native conformance runner
        shell: bash
        env:
          STM_RESULTS_FILE: ${{ github.workspace }}/.artifacts/results/aot.txt
        run: ./.artifacts/conformance-aot/SplashTheMusical.Conformance

      - name: Fail when the native corpus results differ from the JIT results
        shell: bash
        run: |
          if ! git diff --no-index --exit-code --stat .artifacts/results/jit.txt .artifacts/results/aot.txt; then
            git diff --no-index .artifacts/results/jit.txt .artifacts/results/aot.txt | head -100
            echo "::error::The native conformance runner's corpus results differ from the JIT run's."
            exit 1
          fi

      # ReflectionProbe.cs makes a reflection call, and the analyzers are off, so only ILC can refuse it. The publish
      # has its own artifacts path, so it shares no native object file with the publish above.
      - name: Fail unless ILC refuses a reflection call
        shell: bash
        run: |
          if dotnet publish src/SplashTheMusical.Cli -p:StmReflectionProbe=true --artifacts-path .artifacts/probe > .artifacts/probe.log 2>&1; then
            echo "::error::The native publish with ReflectionProbe.cs succeeded, so ILC's warnings do not fail the build."
            exit 1
          fi
          grep -q 'error IL2057' .artifacts/probe.log || { tail -30 .artifacts/probe.log; echo "::error::The probe publish failed without ILC's IL2057."; exit 1; }

      # It reads the stm the first publish step wrote, and the core assembly that publish built in release.
      - name: Fail when the core assembly or stm is more than 5% larger than docs/benchmarks/sizes.md
        run: dotnet run --project tests/SplashTheMusical.Benchmarks -c Release -- size

  # mise run pack: the packages of this commit, and the sample published with native AOT from them alone. The packages
  # are the run's packages artifact. release.yml publishes the packages of a tag.
  packages:
    name: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Pack, and run the sample built from the packages
        run: bash tools/packages/pack.sh

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: .artifacts/package

  # The crash fuzzing of the parity plan's section 7, which mise run fuzz-crash runs locally: 100,000 sources per diagram
  # type, mutated from the corpus, go through STM's parser and renderer under ResourceLimits.Default. A crash, an
  # exception other than MermaidParseException or a missed render deadline fails it. Pull requests use seed 1, so an
  # unrelated find cannot fail one at random. Pushes to main and the weekly run take the run id, so they try new sources.
  # A find is reproducible from its type, the seed and its index.
  crash-fuzz:
    name: crash fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build the conformance runner
        run: dotnet build tests/SplashTheMusical.Conformance -c Release

      - name: Fuzz the parser and renderer with 100,000 sources per type
        env:
          STM_FUZZ_CRASH_SOURCES: "100000"
          STM_FUZZ_SEED: ${{ github.event_name == 'pull_request' && '1' || github.run_id }}
          STM_FUZZ_DIR: ${{ github.workspace }}/.artifacts/fuzz
        run: |
          echo "seed $STM_FUZZ_SEED"
          dotnet run --project tests/SplashTheMusical.Conformance -c Release --no-build -- --treenode-filter "/*/*/FuzzRunTests/CrashFuzzesWhenAsked" --output Detailed

      - name: Upload the finds
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-fuzz
          path: .artifacts/fuzz/crash
          if-no-files-found: ignore
          retention-days: 14

  # STM's stages and the Mermaider baseline, measured on the same runner. docs/benchmarks/stm.md and
  # docs/benchmarks/mermaider-baseline.md are committed from this job's artifact, because a developer's machine runs other
  # work while it measures. The budget step holds STM's parse rows to Mermaider's rows of this run. A shared runner can slow
  # one benchmark process for its whole run, so a row that is slower is measured again, STM's and Mermaider's back to back,
  # and fails only when it is slower both times.
  benchmarks:
    name: benchmarks
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Run STM's stages under JIT and native AOT
        run: dotnet run --project tests/SplashTheMusical.Benchmarks -c Release -- bench --out .artifacts/bench/stm.md

      - name: Run the Mermaider baseline under JIT and native AOT
        run: dotnet run --project tests/SplashTheMusical.Benchmarks -c Release -- mermaider --out .artifacts/bench/mermaider-baseline.md

      - name: Fail when STM's parse rows are over this run's Mermaider rows
        run: dotnet run --project tests/SplashTheMusical.Benchmarks -c Release --no-build -- budget .artifacts/bench/mermaider-baseline.md .artifacts/bench/stm.md --remeasure

      - name: Show how this run differs from the committed numbers
        continue-on-error: true
        run: dotnet run --project tests/SplashTheMusical.Benchmarks -c Release --no-build -- compare docs/benchmarks/stm.md .artifacts/bench/stm.md

      - name: Upload the result files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: |
            .artifacts/bench/stm.md
            .artifacts/bench/mermaider-baseline.md
          if-no-files-found: ignore
          retention-days: 30

  # L4 of the parity plan, the check that the committed oracle output is what the pinned mermaid.js writes, and the
  # oracle round trip. It runs on macOS because the committed boxes files name the macOS fonts Chromium falls back to
  # for emoji and CJK text.
  l4:
    name: l4 and oracle freshness
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23"

      - name: Install the oracle
        run: npm ci --prefix tools/oracle --no-audit --no-fund

      - name: Test the upstream tools' version choice, mermaid 12 and 13 layouts, the ELK probe and the site's scripts
        run: node --test tools/upstream/versions.test.mjs tools/corpus/layout.test.mjs tools/oracle/dumps.test.mjs tools/oracle/elk-probe.test.mjs tools/site/snapshot.test.mjs tools/site/label-issue.test.mjs

      - name: Write STM's SVGs
        env:
          STM_SVG_DIR: ${{ github.workspace }}/.artifacts/stm/svg
        run: dotnet run --project tests/SplashTheMusical.Conformance -- --treenode-filter "/*/*/StmSvgsTests/*"

      # mermaid.js's SVGs and rasters depend on the pinned packages, the oracle scripts, the bundled fonts, the corpus
      # sources and the runner's fallback fonts. ImageOS, such as macos15, stands for the last.
      - name: Name the cache of mermaid.js's SVGs and rasters
        id: oracle-key
        run: |
          prefix="l4-oracle-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS}-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${{ hashFiles('tools/oracle/package-lock.json', 'tools/oracle/*.mjs', 'tools/oracle/fonts/**', 'corpus/**/*.mmd', 'corpus/config.txt') }}" >> "$GITHUB_OUTPUT"

      # A partial match restores rasters that raster.mjs checks against each SVG's hash before it reuses them.
      - name: Restore mermaid.js's SVGs and rasters
        id: oracle-cache
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/corpus/svg
            .artifacts/corpus/raster
          key: ${{ steps.oracle-key.outputs.key }}
          restore-keys: ${{ steps.oracle-key.outputs.prefix }}

      - name: Rewrite the oracle output of the corpus and write mermaid.js's SVGs
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .artifacts
          node tools/oracle/facts.mjs corpus corpus .artifacts/corpus/svg > .artifacts/corpus-oracle.log

      # The scheduled run saves no cache, so it draws only the rasters it scores, as a run without the folder does.
      - name: Rasterize and score both SVGs of every case
        env:
          ORACLE_RASTER_DIR: ${{ github.event_name != 'schedule' && '.artifacts/corpus/raster' || '' }}
          STM_RASTER_DIR: ${{ github.event_name == 'push' && '.artifacts/stm/raster' || '' }}
        run: node tools/oracle/raster.mjs corpus .artifacts/corpus/svg .artifacts/stm/svg corpus/l4.txt .artifacts/raster ${ORACLE_RASTER_DIR:+"$ORACLE_RASTER_DIR"}

      # .github/workflows/site.yml adds these rasters and scores to the site's comparison data as a snapshot of this
      # commit, also when a later step of this job fails.
      - name: Upload the comparison artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison
          path: |
            .artifacts/corpus/raster/**/*.png
            .artifacts/stm/raster
            .artifacts/raster/scores.txt
          if-no-files-found: error
          retention-days: 7

      # The oracle output is every facts, boxes, dagre and ELK file of corpus/, so a committed .elk.txt that differs from
      # what the pinned mermaid.js writes, a missing one and a stale one all fail here. On a cache hit facts.mjs did not
      # run, so this checks only corpus/l4.txt; the cache key holds every input of facts.mjs.
      - name: Fail when the committed oracle output or corpus/l4.txt is stale
        run: |
          changed=$(git status --porcelain -- corpus)
          if [ -n "$changed" ]; then
            echo "$changed" | head -50
            git diff --stat -- corpus | tail -1
            echo "::error::The committed corpus output differs from what the pinned mermaid.js and STM write. Run mise run raster and commit corpus/, or take the files of this run's oracle-corpus artifact."
            exit 1
          fi

      # The oracle output depends on the runner's fonts, so a machine other than macOS cannot write the committed files.
      # When the check above fails, this run's rewritten and new corpus files, such as the .elk.txt files, are uploaded
      # to be committed as they are.
      - name: Upload the corpus files this run rewrote
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p .artifacts/oracle-corpus
          git ls-files -m -o --exclude-standard -- corpus | tar -cf - -T - | tar -xf - -C .artifacts/oracle-corpus
      - name: Upload the oracle-corpus artifact
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-corpus
          path: .artifacts/oracle-corpus
          if-no-files-found: ignore
          retention-days: 30

      - name: Save mermaid.js's SVGs and rasters
        if: github.event_name != 'schedule' && steps.oracle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/corpus/svg
            .artifacts/corpus/raster
          key: ${{ steps.oracle-key.outputs.key }}

      # The oracle round trip of the parity plan's section 7, which mise run oracle-roundtrip runs locally: mermaid.js
      # must read STM's text of every accepted corpus case of a supported type as it reads the case, and accept a sample
      # of random documents of each generator.
      - name: Write STM's text of every accepted case and of random documents
        env:
          STM_ROUNDTRIP_DIR: ${{ github.workspace }}/.artifacts/roundtrip
        run: |
          dotnet run --project tests/SplashTheMusical.Conformance -- --treenode-filter "/*/*/OracleRoundTripTests/WritesTheCasesWhenAsked"
          dotnet run --project tests/SplashTheMusical.Tests -- --treenode-filter "/*/*/OracleSampleTests/*"

      - name: Run the oracle on STM's text
        run: node tools/oracle/facts.mjs .artifacts/roundtrip .artifacts/roundtrip > .artifacts/roundtrip-oracle.log

      # A written case whose facts differ from the committed ones is compared with the oracle's facts of its original on
      # this runner, so the round trip does not depend on the runner's fonts.
      - name: Run the oracle on the original of each case that reads differently
        env:
          STM_ROUNDTRIP_DIR: ${{ github.workspace }}/.artifacts/roundtrip
        run: |
          dotnet run --project tests/SplashTheMusical.Conformance -- --treenode-filter "/*/*/OracleRoundTripTests/CopiesTheDifferingOriginalsWhenAsked"
          node tools/oracle/facts.mjs .artifacts/roundtrip/original .artifacts/roundtrip/original >> .artifacts/roundtrip-oracle.log

      - name: Fail when mermaid.js reads STM's text differently from the case or refuses it
        env:
          STM_ROUNDTRIP_DIR: ${{ github.workspace }}/.artifacts/roundtrip
        run: dotnet run --project tests/SplashTheMusical.Conformance -- --treenode-filter "/*/*/OracleRoundTripTests/ComparesTheFactsWhenAsked"

      # The artifact only helps a reader, so a full storage quota does not fail the job.
      - name: Upload the scores and the side-by-side images of failing cases
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l4-raster
          path: |
            .artifacts/raster
            .artifacts/corpus-oracle.log
            .artifacts/roundtrip
            .artifacts/roundtrip-oracle.log
          if-no-files-found: ignore
          retention-days: 7
