name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build SplashTheMusical.slnx

      - name: Test
        run: dotnet test --solution SplashTheMusical.slnx --no-build

      - name: Check formatting
        run: dotnet format SplashTheMusical.slnx --verify-no-changes --no-restore

      # Trim, AOT and ILC warnings are errors, so this fails on any of them.
      - name: Publish stm with native AOT
        run: dotnet publish src/SplashTheMusical.Cli
