# Runs upstream-bump against the newest mermaid pre-release and posts the delta report to the tracking issue. It changes
# no branch and blocks nothing. docs/upstream-updates.md describes the process.
name: Upstream canary

on:
  schedule:
    - cron: "23 7 * * 2"
  workflow_dispatch:
    inputs:
      version:
        description: The mermaid pre-release to try. Empty means the newest pre-release above npm's latest.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: upstream-canary
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  ISSUE_TITLE: mermaid.js pre-release canary

jobs:
  # macOS, because the committed boxes files name the macOS fonts Chromium falls back to, as in CI's l4 job.
  canary:
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23"

      - name: Pick the pre-release
        id: target
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version=${REQUESTED:-$(node tools/upstream/versions.mjs prerelease)}
          if [ -z "$version" ]; then
            echo "npm has no mermaid pre-release above latest."
          else
            echo "mermaid $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the oracle
        if: steps.target.outputs.version != ''
        run: npm ci --prefix tools/oracle --no-audit --no-fund

      # A failure here is part of the report, so it does not fail the job.
      - name: Move the oracle to the pre-release
        id: bump
        if: steps.target.outputs.version != ''
        continue-on-error: true
        shell: bash
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          mkdir -p .artifacts
          bash tools/upstream/bump.sh "$VERSION" 2>&1 | tee .artifacts/upstream-bump.log

      # The artifact only helps a reader, so a full storage quota does not fail the job.
      - name: Upload the delta report and the logs
        if: always() && steps.target.outputs.version != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-canary
          path: |
            .artifacts/upstream-bump.log
            .artifacts/upstream/before/conformance.log
            .artifacts/upstream/after/conformance.log
            .artifacts/upstream/after/upstream-delta.md
          if-no-files-found: ignore
          retention-days: 14

      # GitHub refuses a comment over 65,536 characters, and the grammar diffs can be longer.
      - name: Post the report to the tracking issue
        if: always() && steps.target.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.target.outputs.version }}
          OUTCOME: ${{ steps.bump.outcome }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          pinned=$(node tools/upstream/versions.mjs pinned)
          body=.artifacts/canary-comment.md
          mkdir -p .artifacts
          {
            echo "## mermaid $VERSION"
            echo
            echo "From mermaid $pinned at $GITHUB_SHA. [Run]($run_url)."
            echo
            if [ "$OUTCOME" = "success" ] && [ -f .artifacts/upstream/after/upstream-delta.md ]; then
              cat .artifacts/upstream/after/upstream-delta.md
            else
              echo "upstream-bump failed before it wrote the report. The end of its log:"
              echo
              echo '```'
              tail -40 .artifacts/upstream-bump.log 2>/dev/null || echo "There is no log."
              echo '```'
            fi
          } > "$body"
          if [ "$(wc -c < "$body")" -gt 60000 ]; then
            head -c 60000 "$body" > "$body.cut"
            printf '\n\n---\nThe report is cut here. The upstream-canary artifact of the run has all of it.\n' >> "$body.cut"
            mv "$body.cut" "$body"
          fi
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | first | .number // empty")
          if [ -z "$issue" ]; then
            issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
              --body "The weekly upstream canary posts the delta report of the newest mermaid pre-release here. docs/upstream-updates.md describes it.")
            issue=${issue_url##*/}
          fi
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$body"
